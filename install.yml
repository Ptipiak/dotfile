- defaults:
    link:
      relink: true
      create: true

# - clean:
#     '~'

- link:
    ~/.config/nvim: ./nvim
    ~/.config/yt-dlp.conf: ./yt-dlp/yt-dlp.conf
    ~/.config/alacritty.toml: ./alacritty.toml
    ~/.config/alacritty/: ./alacritty/
    ~/.nvmrc: ./profile/nvmrc
    ~/.config/fish/config.fish: ./profile/fish/config.fish
    ~/.config/fish/functions/*: ./profile/fish/functions/

- shell:
  - ["git config --global core.editor nvim"]
  - ["git config --global merge.tool fugitive"]
  - ["git config --global mergetool.fugitive.cmd 'nvim -f -c \"Gvdiffsplit!\" \"$MERGED\"'"]
